name: Quarto Render

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render-quarto:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RENV_PATHS_ROOT: ~/.local/share/renv
    steps:
    - uses: actions/checkout@v4

    - uses: quarto-dev/quarto-actions/setup@v2
      with:
        version: 1.8.25

    - name: Set up Linux Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y \
        libudunits2-dev \
        libgdal-dev \
        gdal-bin \
        libgeos-dev \
        libproj-dev \
        pandoc

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.4.3'

    - name: Cache R packages
      uses: actions/cache@v4
      with:
        path: ~/.local/share/renv
        key: ${{ runner.os }}-renv-${{ hashFiles('**/renv.lock') }}
        restore-keys: ${{ runner.os }}-renv-
    
    - name: Cache Quarto freeze
      uses: actions/cache@v4
      with:
        path: src/mban/quarto/_freeze
        key: ${{ runner.os }}-quarto-freeze-${{ hashFiles('src/mban/quarto/**/*.qmd') }}
        restore-keys: ${{ runner.os }}-quarto-freeze-

    - name: Initialize R environment
      working-directory: src/mban/quarto
      run: |
        Rscript -e 'if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv", repos = "https://cloud.r-project.org"); renv::consent(TRUE)'
        Rscript -e 'if (!requireNamespace("units", quietly = TRUE)) install.packages("units", type = "source", repos = "https://cloud.r-project.org")'
        Rscript -e 'renv::restore()'
      env:
        QUARTO_PATH: ${{ env.QUARTO_ROOT }}/bin

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12' 
        cache: 'pip'
        cache-dependency-path: src/mban/quarto/requirements.txt
    
    - name: Cache Python virtual environment
      uses: actions/cache@v4
      with:
        path: src/mban/quarto/venv
        key: ${{ runner.os }}-venv-${{ hashFiles('src/mban/quarto/requirements.txt') }}
        restore-keys: ${{ runner.os }}-venv-

    - name: Render Quarto documents
      working-directory: src/mban/quarto
      run: |
        chmod +x quarto_render.sh
        ./quarto_render.sh

    - name: Commit and push
      run: |
        git config user.email "github@renanperes.com"
        git config user.name "renan-peres"
        git add .
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -m "Render Quarto documents [skip ci]"
        git push
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}