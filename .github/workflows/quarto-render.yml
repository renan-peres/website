name: Quarto Render

on:
  schedule:
    - cron: '0 10 * * 1-5'  # Weekdays at 10 AM UTC
  workflow_dispatch:
  push:
    branches: [main]

# Prevent multiple workflow runs from conflicting
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-quarto:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Prevent hanging jobs
    permissions:
      contents: write
    env:
      RENV_PATHS_ROOT: ~/.local/share/renv
    steps:
    - uses: actions/checkout@v4

    - uses: quarto-dev/quarto-actions/setup@v2
      with:
        version: 1.8.25

    - name: Set up Linux Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y \
        libudunits2-dev \
        libgdal-dev \
        gdal-bin \
        libgeos-dev \
        libproj-dev \
        pandoc

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.4.3'

    - name: Cache R packages
      uses: actions/cache@v4
      with:
        path: ~/.local/share/renv
        key: ${{ runner.os }}-renv-${{ hashFiles('**/renv.lock') }}
        restore-keys: ${{ runner.os }}-renv-

    - name: Cache Quarto freeze
      uses: actions/cache@v4
      with:
        path: src/mban/quarto/_freeze
        key: ${{ runner.os }}-quarto-freeze-${{ hashFiles('src/mban/quarto/**/*.qmd') }}
        restore-keys: ${{ runner.os }}-quarto-freeze-

    - name: Initialize R environment
      working-directory: src/mban/quarto
      run: |
        Rscript -e 'if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv", repos = "https://cloud.r-project.org"); renv::consent(TRUE)'
        Rscript -e 'if (!requireNamespace("units", quietly = TRUE)) install.packages("units", type = "source", repos = "https://cloud.r-project.org")'
        Rscript -e 'renv::restore()'
      env:
        QUARTO_PATH: ${{ env.QUARTO_ROOT }}/bin

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache Python virtual environment
      uses: actions/cache@v4
      with:
        path: src/mban/quarto/venv
        key: ${{ runner.os }}-venv-${{ hashFiles('src/mban/quarto/requirements.txt') }}
        restore-keys: ${{ runner.os }}-venv-

    - name: Set up Python virtual environment
      working-directory: src/mban/quarto
      run: |
        set -e  # Exit on any error
        echo "Setting up Python virtual environment..."
        if [ ! -d "venv" ]; then
          python3 -m venv venv
          echo "✓ Virtual environment created"
        else
          echo "✓ Using cached virtual environment"
        fi
        source venv/bin/activate
        # Verify virtual environment is active
        if [ -z "$VIRTUAL_ENV" ]; then
          echo "Error: Virtual environment not activated correctly"
          exit 1
        fi
        python -m pip install --upgrade pip
        echo "✓ pip upgraded"
        if [ -f "requirements.txt" ]; then
          python -m pip install -r requirements.txt
          echo "✓ Requirements installed"
        fi
        echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
        echo "PATH=$VIRTUAL_ENV/bin:$PATH" >> $GITHUB_ENV

    - name: Render Quarto documents
      working-directory: src/mban/quarto
      run: |
        echo "Python virtual environment: $VIRTUAL_ENV"
        echo "Python version: $(python --version)"
        echo "Quarto version: $(quarto --version)"
        echo "Starting Quarto render..."
        quarto render
        echo "✓ All Quarto documents rendered successfully"

    - name: Commit and push
      run: |
        echo "Configuring git..."
        git config user.email "github@renanperes.com"
        git config user.name "renan-peres"

        echo "Adding changes..."
        git add .

        if git diff --staged --quiet; then
          echo "✓ No changes to commit"
          exit 0
        fi

        echo "Committing changes..."
        git commit -m "Render Quarto documents [skip ci]"

        echo "Pushing changes..."
        git push

        echo "✓ Changes committed and pushed successfully"
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
